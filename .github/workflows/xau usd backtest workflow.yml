name: XAU/USD Backtest Bot

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: 'Timeframe (d/w/m)'
        required: true
        default: 'd'
      n_periods:
        description: 'N periods for avg change (default: 20)'
        required: false
        default: '20'
      trailing_stop_pct:
        description: 'Trailing stop % (default: 0)'
        required: false
        default: '0'
      initial_capital:
        description: 'Initial capital USD (default: 500)'
        required: false
        default: '500'
      start_date:
        description: 'Start date dd/mm/yy (default: 01/01/2023)'
        required: false
        default: '01/01/2023'
      end_date:
        description: 'End date dd/mm/yy (default: today)'
        required: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy pyTelegramBotAPI
    
    - name: Run XAU/USD Backtest
      env:
        TELEGRAM_BT_VangDo_bot_API: ${{ secrets.TELEGRAM_BT_VangDo_bot_API }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python xau_usd_backtest_bot.py \
          "${{ github.event.inputs.timeframe }}" \
          "${{ github.event.inputs.n_periods }}" \
          "${{ github.event.inputs.trailing_stop_pct }}" \
          "${{ github.event.inputs.initial_capital }}" \
          "${{ github.event.inputs.start_date }}" \
          "${{ github.event.inputs.end_date }}"
