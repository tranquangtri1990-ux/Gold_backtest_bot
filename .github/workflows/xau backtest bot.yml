name: XAU Backtest Bot

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy pyTelegramBotAPI

    - name: Notify Telegram - Start
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BT_VangDo_bot_API }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="🚀 <b>XAU Bot đã khởi động</b>%0ABot sẽ chạy tối đa 30 phút.%0A<a href='${RUN_URL}'>Xem logs</a>"

    - name: Run XAU Backtest Bot
      env:
        TELEGRAM_BT_VangDo_bot_API: ${{ secrets.TELEGRAM_BT_VangDo_bot_API }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        timeout 1740 python xau_backtest_bot.py || true

    - name: Notify Telegram - Done
      if: success()
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BT_VangDo_bot_API }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="✅ <b>XAU Bot đã dừng</b>%0A<a href='${RUN_URL}'>Xem logs</a>"

    - name: Notify Telegram - Failed
      if: failure()
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BT_VangDo_bot_API }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d parse_mode="HTML" \
          -d text="❌ <b>XAU Bot bị lỗi</b>%0A<a href='${RUN_URL}'>Xem logs</a>"
