name: XAU Backtest Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy pyTelegramBotAPI tvdatafeed

    - name: Run XAU Backtest Bot
      env:
        TELEGRAM_BT_VangDo_bot_API: ${{ secrets.TELEGRAM_BT_VangDo_bot_API }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        timeout 540 python xau_backtest_bot.py || true
