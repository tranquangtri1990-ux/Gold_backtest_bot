name: XAU Backtest Bot

on:
  schedule:
    # Run every 10 minutes to keep bot responsive
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy pyTelegramBotAPI
    
    - name: Run XAU Backtest Bot
      env:
        TELEGRAM_BT_VangDo_bot_API: ${{ secrets.TELEGRAM_BT_VangDo_bot_API }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Run bot for 9 minutes (workflow runs every 10 min)
        timeout 540 python xau_backtest_bot.py || true
